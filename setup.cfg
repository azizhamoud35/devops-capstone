[nosetests]
verbosity = 2
with-coverage = 1
cover-package = service
cover-erase = 1
cover-html = 1
cover-html-dir = cover

[coverage:run]
source = service
branch = True
omit =
    tests/*
    */__init__.py

[coverage:report]
show_missing = True
precision = 2
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:

[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    build,
    dist,
    venv,
    .venv
extend-ignore = E203, W503, E402

[pylint]
max-line-length = 120
disable =
    C0114,
    C0115,
    C0116,
    R0903,
    W0212
ignore-patterns =
    tests.*,
    __init__.py

[tool:pytest]
minversion = 7.0
addopts = -ra -q --cov=service --cov-report=term-missing --cov-report=html
testpaths = tests
python_files = test_*.py
